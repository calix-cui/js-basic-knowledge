<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtualized List</title>
  <style>
    * {
      box-sizing: border-box;
    }
    #list-container {
      width: 300px;
      height: 400px;
      overflow-y: auto;
      border: 1px solid #ccc;
      position: relative;
    }
    .list-item {
      height: 50px;
      padding: 10px;
      box-sizing: border-box;
      border-bottom: 1px solid #ddd;
    }
    #list {
      position: relative;
    }
    #content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="list-container">
    <div id="list">
      <div id="content"></div>
    </div>
  </div>

  <script src="./index.js"></script>
  <script src="./index.css"></script>

</body>
</html>
